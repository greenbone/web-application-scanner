name: security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-cargo-deny-${{ hashFiles('Cargo.lock') }}
      - name: Install cargo-deny
        run: cargo install --locked --version 0.19.6 cargo-deny
      - run: cargo-deny --locked check

  unused-dependencies:
    name: unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-cargo-machete-${{ hashFiles('Cargo.lock') }}
      - name: Install cargo-machete
        run: cargo install --locked --version 0.7.0 cargo-machete
      - name: Check unused dependencies
        run: |
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo-machete

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup default stable
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust
