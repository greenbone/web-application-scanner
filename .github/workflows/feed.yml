name: Feed Generation

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 5 * * *" # 5:30h every day

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  feed:
    name: Feed Generation
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@v3
        with:
          rust-version: stable
      - name: Generate and validate NASL feed
        id: generate
        run: |
          set +e
          ./bin/generate-feed
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Archive generated NASL feed
        if: always()
        run: |
          test -d tmp/feed
          rm -f tmp/generated-nasl-feed.tar.gz
          tar -czf tmp/generated-nasl-feed.tar.gz -C tmp/feed .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-nasl-feed
          path: tmp/generated-nasl-feed.tar.gz
          if-no-files-found: error
      - name: Fail if feed generation failed
        if: always() && steps.generate.outputs.status != '0'
        run: exit "${{ steps.generate.outputs.status }}"
