[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

# Current transitive duplicates in Cargo.lock. For each duplicate crate, skip
# only the older accepted versions and leave the newest current version
# unskipped as the duplicate-detection anchor. That keeps today's known
# upstream transitions passing while causing any newly introduced duplicate
# version to fail CI.
skip = [
  { name = "getrandom", version = "0.2.17" },
  { name = "hashbrown", version = "0.14.5" },
  { name = "hashbrown", version = "0.16.1" },
  { name = "windows-sys", version = "0.52.0" },
  { name = "tower-http", version = "0.6.11"},
  { name = "wit-bindgen", version = "0.51.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
