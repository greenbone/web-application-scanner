[package]
name = "greenbone-was"
version = "0.1.0"
edition = "2024"
description = "Greenbone web application scanner"
publish = false
default-run = "greenbone-was"

[features]
default = ["api-docs"]
api-docs = ["utoipa", "utoipa-swagger-ui"]

[[bin]]
name = "greenbone-was"
path = "src/main.rs"

[[bin]]
name = "was-cli-test"
path = "src/clitest.rs"

[[bin]]
name = "greenbone-was-vtgen"
path = "src/bin/greenbone-was-vtgen.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
config = "0.15.23"
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["default", "env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4"] }
regex = "1.12.3"
utoipa = { version = "5", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "9", features = ["axum"], optional = true }

[dev-dependencies]
serial_test = "3.5.0"
tempfile = "3.27.0"
tracing-test = "0.2"
wiremock = "0.6"
